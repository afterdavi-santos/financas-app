spring.application.name=financas-app

spring.datasource.url=jdbc:postgresql://localhost:5433/financas_db
spring.datasource.username=postgres
spring.datasource.password=***REMOVED***

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

jwt.secret=***REMOVED***
# Tempo de sessao: 2h (7.200.000 ms). Ao expirar, o backend responde 401 e o
# front desloga automaticamente mandando para a tela de login.
jwt.expiration-ms=7200000

# Origem(ns) do frontend liberada(s) para CORS (dev: Vite em 5173).
# Aceita lista separada por virgula quando for pra nuvem.
app.cors.allowed-origins=http://localhost:5173
