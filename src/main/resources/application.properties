spring.application.name=financas-app

spring.datasource.url=jdbc:postgresql://localhost:5433/financas_db
spring.datasource.username=postgres
# Mesma regra do jwt.secret: vem do ambiente, nunca do arquivo. Sem a variavel
# a aplicacao nao sobe. O docker-compose le a mesma senha do .env da raiz (que
# nao e versionado); esta variavel e a copia que o app enxerga.
spring.datasource.password=${POSTGRES_PASSWORD}

# Migracao de schema versionada (db/migration). O baseline-on-migrate e o que
# permite adotar Flyway num banco que ja existe: em vez de tentar rodar o V1
# sobre um schema ja criado (que falharia em "relation already exists"), o
# Flyway carimba o banco como "ja esta na versao 1" e so aplica do V2 em
# diante. Num banco vazio - banco novo, ou o Postgres efemero dos testes - o V1
# roda normalmente. Mesmo arquivo, os dois casos corretos.
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.flyway.baseline-description=schema anterior ao Flyway

# `validate`, nao `update`: o Hibernate compara entidades e schema no start e
# RECUSA subir se discordarem, em vez de alterar o banco sozinho. Quem muda
# schema agora e o Flyway, e so ele.
#
# Por que isso importa aqui, com dois casos reais deste projeto:
#  - o `update` chegou a DROPAR uma constraint unica de `renda` no startup sem
#    recriar, o que obrigou a criar os indices na mao num ApplicationRunner;
#  - a coluna da taxa de CDI ficou `numeric(38,2)` quando a taxa tem 6 casas, e
#    arredondou rendimento de CDB por semanas sem ninguem notar. Com `validate`
#    o app teria falhado no primeiro start, apontando a coluna.
#
# O preco: mudar entidade agora exige escrever a migracao correspondente. Se
# esquecer, o app nao sobe — que e exatamente o objetivo.
spring.jpa.hibernate.ddl-auto=validate
# Loga todo SQL executado — junto com os valores de despesa/renda. Deixe
# desligado por padrao e ligue so quando estiver depurando uma query.
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Segredo de assinatura do JWT: vem SEMPRE do ambiente, nunca do arquivo.
# Sem a variavel JWT_SECRET definida a aplicacao nao sobe — e proposital, e
# melhor falhar no start do que rodar com um segredo conhecido. Para gerar:
#   python -c "import secrets,base64; print(base64.b64encode(secrets.token_bytes(64)).decode())"
# Trocar o segredo invalida todas as sessoes ativas (todo mundo reloga).
jwt.secret=${JWT_SECRET}
# Sessao com janela deslizante: cada requisicao autenticada renova o token
# (ver JwtAuthenticationFilter/JwtService) por mais jwt.expiration-ms a partir
# de agora. A pessoa so e desconectada se ficar esse tempo (24h) sem usar o
# app. jwt.max-sessao-ms e um teto absoluto (7 dias) a partir do PRIMEIRO
# login: mesmo com uso diario continuo, forca um novo login depois desse
# prazo, para limitar o estrago de um token vazado/roubado.
jwt.expiration-ms=86400000
jwt.max-sessao-ms=604800000

# Origem(ns) do frontend liberada(s) para CORS (dev: Vite em 5173).
# Aceita lista separada por virgula quando for pra nuvem.
app.cors.allowed-origins=http://localhost:5173

# Upload do CSV da fatura (leitor de fatura Nubank) — default do Spring Boot
# e 1MB/10MB, pequeno demais mesmo para um CSV de varios meses.
spring.servlet.multipart.max-file-size=2MB
spring.servlet.multipart.max-request-size=2MB
