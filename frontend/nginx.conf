server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # O mesmo redirect de SPA que o netlify.toml faz na nuvem: as rotas
    # ("/planejamento", "/movimentacoes") só existem dentro do JavaScript, não
    # como arquivos. Sem esta linha, abrir uma delas direto — ou dar F5 estando
    # nela — devolve 404, porque o Nginx procura um arquivo que nunca existiu.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Os assets do Vite têm hash no nome (index-CKDNrNgI.js): quando o conteúdo
    # muda, o nome muda junto. Por isso podem ser cacheados para sempre — o
    # navegador nunca serve um arquivo velho por engano, ele pede um nome novo.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # O index.html NÃO pode ser cacheado: é ele que aponta para os assets com
    # hash. Um index velho em cache manteria a pessoa numa versão antiga do app
    # mesmo depois do deploy.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    gzip on;
    gzip_types text/css application/javascript image/svg+xml application/json;
    gzip_min_length 1024;
}
