services:
  postgres:
    image: postgres:16
    container_name: financas-postgres
    environment:
      POSTGRES_DB: financas_db
      POSTGRES_USER: postgres
      # Vem do .env (nao versionado). Sem ele o compose falha, que e o desejado.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env}
    ports:
      # So loopback. Com "5433:5432" o Docker publica em 0.0.0.0 e qualquer
      # maquina da rede alcanca o banco direto, contornando a API e o JWT.
      - "127.0.0.1:5433:5432"
    volumes:
      - financas-postgres-data:/var/lib/postgresql/data

volumes:
  financas-postgres-data:
